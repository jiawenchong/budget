<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>记账本</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f7d6b">
<style>
  :root{
    --accent:#2f7d6b;
    --accent-light:#e6f2ef;
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#1c2024;
    --muted:#8a8f98;
    --danger:#d1453d;
    --warn:#c98a1f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:64px;
  }
  header.top{
    padding:18px 16px 14px;
    background:var(--accent);
    color:#fff;
  }
  header.top .total-label{font-size:13px;opacity:.85;}
  header.top .total-value{font-size:30px;font-weight:700;margin-top:2px;}
  header.top .total-sub{font-size:12px;opacity:.8;margin-top:4px;}

  main{flex:1;padding:14px 14px 24px;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .card h3{margin:0 0 8px;font-size:15px;}
  .section-title{
    font-size:13px;
    color:var(--muted);
    margin:18px 4px 8px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .row{display:flex;justify-content:space-between;align-items:center;}
  .row + .row{margin-top:6px;}
  .name{font-weight:600;font-size:15px;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .amount{font-weight:700;font-size:16px;}
  .amount.small{font-size:13px;font-weight:500;color:var(--muted);}

  .pill-btn{
    border:none;
    background:var(--accent);
    color:#fff;
    border-radius:10px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
  }
  .pill-btn.ghost{
    background:var(--accent-light);
    color:var(--accent);
  }
  .pill-btn.danger{background:var(--danger);}
  .icon-btn{
    border:none;background:none;color:var(--muted);font-size:18px;padding:4px 6px;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:24px 10px;
  }

  .progress-bar{
    height:8px;
    border-radius:5px;
    background:#eceff1;
    overflow:hidden;
    margin-top:8px;
  }
  .progress-bar > div{
    height:100%;
    background:var(--accent);
  }
  .progress-bar > div.over{background:var(--warn);}

  .fab{
    position:fixed;
    right:50%;
    bottom:76px;
    transform:translateX(167px);
    width:48px;height:48px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:26px;
    border:none;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:480px){
    .fab{right:16px;transform:none;}
  }

  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:#fff;
    border-top:1px solid #eee;
    display:flex;
    max-width:480px;
    margin:0 auto;
  }
  nav.tabbar button{
    flex:1;
    border:none;background:none;
    padding:10px 0 8px;
    font-size:11px;
    color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  nav.tabbar button .ic{font-size:18px;}
  nav.tabbar button.active{color:var(--accent);font-weight:600;}

  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal-sheet{
    background:#fff;
    width:100%;
    max-width:480px;
    border-radius:18px 18px 0 0;
    padding:18px 18px 28px;
    max-height:85vh;
    overflow-y:auto;
  }
  .modal-sheet h2{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #e0e2e6;
    font-size:15px;
    background:#fafbfc;
  }
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:11px 0;border-radius:10px;border:none;font-size:14px;font-weight:600;}
  .modal-actions .cancel{background:#f0f1f3;color:var(--text);}
  .modal-actions .submit{background:var(--accent);color:#fff;}

  .link-text{color:var(--accent);font-size:13px;font-weight:600;background:none;border:none;padding:0;}
  .file-row{display:flex;gap:10px;}
  .file-row label{flex:1;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="total-label">资产总览(折算为 <span id="baseCurrencyLabel">-</span>)</div>
    <div class="total-value" id="totalValue">0</div>
    <div class="total-sub" id="totalSecondary"></div>
    <div class="total-sub" id="poolLine"></div>
    <div class="total-sub" id="goalAlert"></div>
  </header>
  <main id="view"></main>
  <button class="fab" id="fabBtn">+</button>
  <nav class="tabbar">
    <button data-tab="overview" class="active"><span class="ic">&#9673;</span>总览</button>
    <button data-tab="categories"><span class="ic">&#9636;</span>分类</button>
    <button data-tab="goals"><span class="ic">&#9733;</span>目标</button>
    <button data-tab="history"><span class="ic">&#8634;</span>历史</button>
    <button data-tab="settings"><span class="ic">&#9881;</span>设置</button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ---------- 数据层 ---------- */
const STORAGE_KEY = 'budgetAppData_v1';
const APP_VERSION = '2026.10.15-4';

const PRESET_CATEGORIES = [
  'Savings', 'Flight ticket', 'Parents', 'Commonwealth',
  '旅遊基金', '送禮基金', '澳大利亞基金',
  '房租', '储蓄', '饮食', '研究所学费', '购物与日用', '旅行基金', '水电交通', '弹性预备'
];
const CUSTOM_OPTION = '__custom__';

// 百分比分配方案（可在设置里一键套用）
const PERCENT_PLAN = [
  {name:'房租', percent:20},
  {name:'储蓄', percent:20},
  {name:'饮食', percent:18},
  {name:'研究所学费', percent:15},
  {name:'购物与日用', percent:8},
  {name:'旅行基金', percent:7},
  {name:'水电交通', percent:6},
  {name:'弹性预备', percent:6}
];

function defaultState(){
  return {
    baseCurrency: 'NTD',
    secondaryCurrency: 'MYR',
    rates: { NTD: 1, MYR: 8 }, // 1 单位该币种 = rates[code] 个 base currency
    unallocated: 0, // 未分配资金池，按本位币计
    categories: [],
    goals: [],
    history: [],
    lastBackupAt: null // 上次导出备份的时间（ISO 字符串）
  };
}

// 备份提醒：超过 7 天没导出就提醒（Safari 连续 7 天没打开网站可能会清掉网站数据）
const BACKUP_REMIND_DAYS = 7;
function daysSinceBackup(){
  if(!state.lastBackupAt) return null;
  const t = new Date(state.lastBackupAt).getTime();
  if(isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}
function hasAnyData(){
  return state.categories.length>0 || state.history.length>0 || state.goals.length>0 || Math.abs(state.unallocated||0)>=0.01;
}
function backupStatusText(){
  const d = daysSinceBackup();
  if(d===null) return '还没备份过';
  const when = localDateStr(new Date(state.lastBackupAt));
  return d===0 ? `上次备份：今天（${when}）` : `上次备份：${when}（${d} 天前）`;
}

// 旧版目标只能关联一个分类（linkedCategoryId），统一转成可多选的 linkedCategoryIds
function migrateGoal(g){
  if(!g.notes) g.notes = [];
  if(!Array.isArray(g.linkedCategoryIds)){
    g.linkedCategoryIds = g.linkedCategoryId ? [g.linkedCategoryId] : [];
  }
  delete g.linkedCategoryId;
}

// 读取本机数据与导入备份共用：补齐旧版缺少的字段、修正异常值。格式不对时抛出错误
function normalizeData(data){
  if(!data || !Array.isArray(data.categories) || !Array.isArray(data.goals)) throw new Error('格式不对');
  if(!data.baseCurrency) data.baseCurrency = 'NTD';
  if(!data.rates) data.rates = { NTD: 1, MYR: 8 };
  data.rates[data.baseCurrency] = 1; // 本位币汇率永远是 1（修复旧版「添加币种」可能把它盖掉的问题）
  if(!data.secondaryCurrency || data.rates[data.secondaryCurrency]===undefined){
    data.secondaryCurrency = data.rates.MYR ? 'MYR' : data.baseCurrency;
  }
  if(!Array.isArray(data.history)) data.history = [];
  if(typeof data.unallocated !== 'number' || isNaN(data.unallocated)) data.unallocated = 0;
  data.categories.forEach(c=>{
    if(c.monthlyPlan===undefined) c.monthlyPlan = 0;
    if(c.monthlyPercent===undefined) c.monthlyPercent = 0;
    if(!c.notes) c.notes = [];
  });
  data.goals.forEach(migrateGoal);
  return data;
}

function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return defaultState();
  try{
    return normalizeData(JSON.parse(raw));
  }catch(e){
    // 读不出来时先把原始数据另存一份，避免下一次保存把它覆盖掉
    try{ localStorage.setItem(STORAGE_KEY + '_broken_' + Date.now(), raw); }catch(_){}
    alert('读取记账数据时出错，已另外保留一份原始数据。建议导入最近的备份。');
    return defaultState();
  }
}

// 本地日期 YYYY-MM-DD（toISOString 是 UTC，台湾早上 8 点前会变成前一天）
function localDateStr(d){
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function r2(n){ return Math.round((n||0)*100)/100; }

// 记账时把这笔对「分类余额」和「未分配池」的实际影响一起存下来（catDelta 为分类币种，poolDelta 为本位币），
// 之后删除记录时按当时的影响原样撤销，不受后来改汇率影响
function addHistoryEntry(entry){
  const e = {id: uid(), date: localDateStr(), ...entry};
  e.baseAmount = r2(entry.baseAmount !== undefined ? entry.baseAmount : toBase(entry.amount, entry.currency));
  if(e.catDelta !== undefined) e.catDelta = r2(e.catDelta);
  if(e.poolDelta !== undefined) e.poolDelta = r2(e.poolDelta);
  state.history.unshift(e);
}

function save(){
  // 统一四舍五入到分，避免浮点误差慢慢累积（例如显示 0 但其实是 -0.0000001）
  state.unallocated = r2(state.unallocated);
  state.categories.forEach(c=>{ c.balance = r2(c.balance); });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = load();
let activeTab = 'overview';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function ensureRate(code){
  if(!state.rates[code]) state.rates[code] = code === state.baseCurrency ? 1 : 1;
}

function toBase(amount, currency){
  const rate = state.rates[currency] !== undefined ? state.rates[currency] : 1;
  return amount * rate;
}

function fmt(n){
  return (Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
}

// 各分类百分比合计（可排除某个分类，用于编辑时计算剩余额度）
function percentUsed(excludeId){
  const sum = state.categories.filter(c=>c.id!==excludeId).reduce((s,c)=>s+(c.monthlyPercent||0),0);
  return Math.round(sum*100)/100;
}
function percentLeft(excludeId){
  return Math.max(0, Math.round((100 - percentUsed(excludeId))*100)/100);
}
// 校验某分类的百分比输入，合法时返回 ''
function percentError(value, excludeId){
  if(value<0) return '百分比不能是负数';
  const left = percentLeft(excludeId);
  if(value > left + 1e-9){
    return `百分比合计不能超过 100%。\n其他分类已用 ${fmt(percentUsed(excludeId))}%，这个分类最多只能填 ${fmt(left)}%。`;
  }
  return '';
}

function fromBase(baseAmount, currency){
  const rate = state.rates[currency] !== undefined ? state.rates[currency] : 1;
  return baseAmount / rate;
}

// 已是本位币金额时使用：{primary: 本位币, secondary: 次要币种换算}
function dualPartsForBase(baseAmount){
  const primary = `${fmt(baseAmount)} ${state.baseCurrency}`;
  const secondary = state.secondaryCurrency === state.baseCurrency
    ? ''
    : `${fmt(fromBase(baseAmount, state.secondaryCurrency))} ${state.secondaryCurrency}`;
  return { primary, secondary };
}

// 原始金额 + 币种时使用：{primary: 原币种, secondary: 本位币/次要币种换算}
function dualPartsForCurrency(amount, currency){
  const baseAmount = toBase(amount, currency);
  const primary = `${fmt(amount)} ${currency}`;
  const secondaryBits = [];
  if(currency !== state.baseCurrency) secondaryBits.push(`${fmt(baseAmount)} ${state.baseCurrency}`);
  if(state.secondaryCurrency !== currency && state.secondaryCurrency !== state.baseCurrency){
    secondaryBits.push(`${fmt(fromBase(baseAmount, state.secondaryCurrency))} ${state.secondaryCurrency}`);
  }
  return { primary, secondary: secondaryBits.join(' ≈ ') };
}
function dualHtml(parts, cssClass){
  return `<div class="${cssClass}">${parts.primary}</div>${parts.secondary?`<div class="sub" style="text-align:right;">≈ ${parts.secondary}</div>`:''}`;
}

/* ---------- 渲染 ---------- */
// 目标的期限文字：本月到期不算「已到期」，过了这个月才算
function goalTimeText(monthsRemaining){
  if(monthsRemaining < 0) return '已过期';
  if(monthsRemaining === 0) return '本月到期';
  return `剩 ${monthsRemaining} 个月`;
}

// 顶部总资产与目标提醒（单独拆出来，改汇率时只刷新这里，不会打断正在输入的栏位）
function renderHeader(){
  document.getElementById('baseCurrencyLabel').textContent = state.baseCurrency;
  const catTotal = state.categories.reduce((sum,c)=> sum + toBase(c.balance, c.currency), 0);
  const pool = state.unallocated || 0;
  const total = catTotal + pool;
  const totalParts = dualPartsForBase(total);
  document.getElementById('totalValue').textContent = totalParts.primary;
  document.getElementById('totalSecondary').textContent = totalParts.secondary ? `≈ ${totalParts.secondary}` : '';
  const poolParts = dualPartsForBase(pool);
  document.getElementById('poolLine').textContent =
    `未分配(可自由支配) ${poolParts.primary}${poolParts.secondary?' ≈ '+poolParts.secondary:''} ・ 已分配 ${fmt(catTotal)} ${state.baseCurrency}`;

  // 目标提醒：找最近 1 个未达成目标
  const upcoming = state.goals
    .map(g=>computeGoal(g))
    .filter(g=>g.shortfall>0)
    .sort((a,b)=>a.monthsRemaining-b.monthsRemaining)[0];
  const upcomingShortfall = upcoming ? dualPartsForBase(upcoming.shortfall) : null;
  document.getElementById('goalAlert').textContent = upcoming
    ? `最近目标:"${upcoming.name}" 还差 ${upcomingShortfall.primary}${upcomingShortfall.secondary?'（≈'+upcomingShortfall.secondary+'）':''}，${goalTimeText(upcoming.monthsRemaining)}`
    : (state.goals.length ? '所有目标已达成 🎉' : '');
}

function render(){
  renderHeader();

  document.querySelectorAll('nav.tabbar button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab===activeTab);
  });

  const view = document.getElementById('view');
  if(activeTab==='overview') view.innerHTML = renderOverview();
  else if(activeTab==='categories') view.innerHTML = renderCategories();
  else if(activeTab==='goals') view.innerHTML = renderGoals();
  else if(activeTab==='history') view.innerHTML = renderHistory();
  else if(activeTab==='settings') view.innerHTML = renderSettings();

  document.getElementById('fabBtn').style.display = (activeTab==='settings' || activeTab==='history') ? 'none' : 'flex';
}

function backupReminderHtml(){
  if(!hasAnyData()) return '';
  const d = daysSinceBackup();
  if(d!==null && d < BACKUP_REMIND_DAYS) return '';
  const title = d===null ? '还没备份过数据' : `已经 ${d} 天没备份了`;
  return `<div class="card" style="border:1px solid var(--warn);background:#fff8ec;">
    <div class="name" style="color:var(--warn);">⚠️ ${title}</div>
    <div class="sub" style="margin-bottom:10px;">数据只存在这台手机的浏览器里。Safari 连续 7 天没打开这个网站时，可能会清掉网站数据，建议现在导出一份备份。</div>
    <button class="pill-btn" style="width:100%;background:var(--warn);" onclick="exportData()">立即导出备份</button>
  </div>`;
}

function renderOverview(){
  let html = backupReminderHtml();
  html += `<div class="modal-actions" style="margin-top:0;margin-bottom:14px;">
    <button class="pill-btn" onclick="openIncomeModal()">入账</button>
    <button class="pill-btn ghost" onclick="openSpendModal()">记支出</button>
    <button class="pill-btn ghost" onclick="openAllocateModal()">本月分配</button>
  </div>`;
  html += `<div class="section-title">未分配资金池</div><div class="card">
    <div class="row">
      <div>
        <div class="name">未分配</div>
        <div class="sub">薪水等收入先「入账」到这里，再用「本月分配」划到各分类</div>
      </div>
      <div style="flex-shrink:0;margin-left:10px;">${dualHtml(dualPartsForBase(state.unallocated||0), 'amount')}</div>
    </div>
    <button class="link-text" style="margin-top:10px;" onclick="openReconcileModal()">对账：和银行余额核对、校正金额 ›</button>
  </div>`;
  if(state.categories.length===0 && state.goals.length===0){
    return html + `<div class="empty">还没有分类。<br>点右下角 “+” 添加第一个分类吧。</div>`;
  }
  if(state.categories.length){
    html += `<div class="section-title">分类余额</div><div class="card">`;
    state.categories.forEach((c,i)=>{
      html += `<div class="row">
        <div class="name">${escapeHtml(c.name)}</div>
        <div>${dualHtml(dualPartsForCurrency(c.balance, c.currency), 'amount')}</div>
      </div>${i<state.categories.length-1?'<hr style="border:none;border-top:1px solid #f0f1f3;margin:8px 0">':''}`;
    });
    html += `</div>`;
  }
  if(state.goals.length){
    html += `<div class="section-title">目标进度</div>`;
    state.goals.forEach(g=>{
      html += goalCardHtml(g);
    });
  }
  return html;
}

function renderCategories(){
  if(state.categories.length===0){
    return `<div class="empty">还没有分类。<br>点右下角 “+” 新建一个分类(比如：日常 / 旅游 / 应急金)。</div>`;
  }
  const pUsed = percentUsed(null);
  let percentBanner = '';
  if(pUsed > 100){
    percentBanner = `<div class="card" style="border:1px solid var(--danger);">
      <div class="name" style="color:var(--danger);">百分比合计 ${fmt(pUsed)}%，超过 100%</div>
      <div class="sub">请编辑分类把百分比调低 ${fmt(pUsed-100)}%，否则无法按百分比分配。</div>
    </div>`;
  }else if(pUsed > 0){
    percentBanner = `<div class="card"><div class="row">
      <div class="sub">百分比合计</div>
      <div class="amount small">${fmt(pUsed)}%${pUsed<100?` ・ 还可分配 ${fmt(100-pUsed)}%`:' ✓'}</div>
    </div></div>`;
  }
  return percentBanner + state.categories.map(c=>{
    const notesSum = (c.notes||[]).reduce((s,n)=>s+n.amount,0);
    return `
    <div class="card">
      <div class="row">
        <div class="name">${escapeHtml(c.name)}</div>
        <div>${dualHtml(dualPartsForCurrency(c.balance, c.currency), 'amount')}</div>
      </div>
      ${c.notes && c.notes.length ? `<div class="sub" style="margin-top:4px;">明细 ${c.notes.length} 项 ・ 合计 ${fmt(notesSum)} ${c.currency}</div>` : ''}
      ${c.monthlyPlan>0 ? `<div class="sub">每月固定分配 ${fmt(c.monthlyPlan)} ${c.currency}</div>` : ''}
      ${(c.monthlyPercent||0)>0 ? `<div class="sub">每月分配 ${fmt(c.monthlyPercent)}%</div>` : ''}
      <div class="modal-actions" style="margin-top:12px;">
        <button class="pill-btn ghost" onclick="openAddMoneyModal('${c.id}')">存入/支出</button>
        <button class="pill-btn ghost" onclick="openCategoryNotesModal('${c.id}')">明细备忘</button>
        <button class="pill-btn ghost" onclick="openEditCategoryModal('${c.id}')">编辑</button>

// 目标可关联多个分类：所有目标按到期日由近到远依次取用分类余额，同一笔钱不会被重复计入多个目标。
// 每个目标优先取「后面目标用不到」的分类，再取共用分类，尽量把共用的钱留给后面的目标。
function computeGoalAllocations(){
  const remaining = {};
  state.categories.forEach(c=>{ remaining[c.id] = Math.max(0, toBase(c.balance, c.currency)); });
  const order = state.goals.map((g,i)=>({g,i}))
    .sort((a,b)=>a.g.deadline.localeCompare(b.g.deadline) || a.i-b.i)
    .map(x=>x.g);
  const result = {};
  order.forEach((g, idx)=>{
    const ids = (g.linkedCategoryIds||[]).filter(id=>remaining[id]!==undefined);
    if(ids.length===0){
      result[g.id] = {savedBase: toBase(g.manualSaved||0, g.currency), parts:[], linked:false};
      return;
    }
    const later = order.slice(idx+1);
    const laterUse = id => later.filter(x=>(x.linkedCategoryIds||[]).includes(id)).length;
    const sorted = ids.map((id,k)=>({id, k, u:laterUse(id)})).sort((a,b)=>a.u-b.u || a.k-b.k);
    let need = toBase(g.targetAmount, g.currency);
    let saved = 0;
    const parts = [];
    sorted.forEach(({id})=>{
      if(need<=0) return;
      const take = Math.min(remaining[id], need);
      if(take>0){
        remaining[id] -= take; need -= take; saved += take;
        parts.push({catId:id, base:take});
      }
    });
    result[g.id] = {savedBase: saved, parts, linked:true};
  });
  return result;
}

function computeGoal(g){
  const targetBase = toBase(g.targetAmount, g.currency);
  const alloc = computeGoalAllocations()[g.id] || {savedBase:0, parts:[], linked:false};
  const savedBase = alloc.savedBase;
  const shortfall = targetBase - savedBase;
  const now = new Date();
  const [dy, dm] = g.deadline.split('-').map(Number);
  const monthsRemaining = (dy - now.getFullYear())*12 + (dm - (now.getMonth()+1));
  const monthlyNeeded = shortfall>0 ? shortfall/Math.max(monthsRemaining,1) : 0;
  return {
    ...g, targetBase, savedBase, shortfall, monthsRemaining, monthlyNeeded,
    parts: alloc.parts, linked: alloc.linked,
    pct: targetBase>0 ? Math.min(100, Math.max(0,(savedBase/targetBase)*100)) : 0
  };
}

function goalCardHtml(gRaw){

  const breakdown = g.parts.map(p=>{
    const c = state.categories.find(x=>x.id===p.catId);
    return `${escapeHtml(c?c.name:'')} ${dualPartsForBase(p.base).primary}`;

  return `<div class="card">

      <div class="amount small">${g.deadline} 前</div>
    </div>
    <div class="sub">目标 ${targetParts.primary}${targetParts.secondary?` ≈ ${targetParts.secondary}`:''}${linkedCats.length?` ・ 关联分类「${linkedCats.map(c=>escapeHtml(c.name)).join('」「')}」`:''}</div>
    ${breakdown ? `<div class="sub">取自：${breakdown}</div>` : ''}

    <div class="progress-bar"><div class="${g.shortfall<=0?'':''}" style="width:${g.pct}%"></div></div>
    <div class="row" style="margin-top:8px;">
      <div class="sub">已存 ≈ ${savedParts.primary}${savedParts.secondary?`（≈${savedParts.secondary}）`:''} / ${fmt(g.targetBase)} ${state.baseCurrency}</div>
    </div>
    <div class="row">
      <div class="amount small" style="color:${g.shortfall>0?'#d1453d':'#2f7d6b'}">

      : '剩 '+g.monthsRemaining+' 个月，平均每月需存 '+monthlyParts.primary+(monthlyParts.secondary?'（≈'+monthlyParts.secondary+'）':'')
    }</div>` : ''}
    ${g.notes && g.notes.length ? `<div class="sub" style="margin-top:4px;">明细 ${g.notes.length} 项 ・ 合计 ${fmt(notesSum)} ${g.currency}</div>` : ''}
    <div class="modal-actions" style="margin-top:12px;">

}

const HISTORY_TYPE_LABEL = {deposit:'存入', expense:'支出', allocation:'本月分配', create:'新建分类', income:'入账', transfer:'从未分配池划入', release:'删除分类，余额转入未分配池', adjust:'余额校正'};

function renderHistory(){
  if(state.history.length===0){
    return `<div class="empty">还没有历史记录。<br>入账、支出或本月分配后会自动记录在这里。</div>`;
  }
  // 本月收支小结：只统计真实进出（入账/外部存入 vs 支出）。
  // 新建分类时填的初始余额是「本来就有的钱」，内部划转与余额校正也不是收支，都不算
  const ym = localDateStr().slice(0,7);
  let inBase = 0, outBase = 0;
  state.history.forEach(h=>{
    if(!h.date || !h.date.startsWith(ym)) return;
    const b = h.baseAmount !== undefined ? h.baseAmount : toBase(h.amount, h.currency);
    if(h.type==='income' || h.type==='deposit'){ if(b>0) inBase += b; }
    else if(h.type==='expense'){ outBase += Math.abs(b); }
  });
  const netBase = inBase - outBase;
  const inParts = dualPartsForBase(inBase);
  const outParts = dualPartsForBase(outBase);
  const netParts = dualPartsForBase(Math.abs(netBase));
  let html = `<div class="card">
    <h3>本月收支（${ym}）</h3>
    <div class="row"><div class="sub">入账</div><div class="amount small" style="color:var(--accent);">${inBase>0?'+':''}${inParts.primary}${inParts.secondary?'（≈'+inParts.secondary+'）':''}</div></div>
    <div class="row"><div class="sub">支出</div><div class="amount small" style="color:var(--danger);">${outBase>0?'-':''}${outParts.primary}${outParts.secondary?'（≈'+outParts.secondary+'）':''}</div></div>
    <div class="row"><div class="sub">净变化</div><div class="amount small" style="color:${netBase>=0?'var(--accent)':'var(--danger)'};">${netBase>0?'+':(netBase<0?'-':'')}${netParts.primary}${netParts.secondary?'（≈'+netParts.secondary+'）':''}</div></div>
    <div class="sub" style="margin-top:6px;">分配/划转是内部转移，新建分类的初始余额是原本就有的钱，余额校正是修正记账误差，都不计入收支。</div>
  </div>`;
  let lastDate = null;
  state.history.forEach(h=>{
    if(h.date!==lastDate){
      html += `<div class="section-title">${h.date}</div>`;
      lastDate = h.date;
    }
    const parts = dualPartsForCurrency(Math.abs(h.amount), h.currency);
    const sign = h.amount<0 ? '-' : '+';
    const color = h.amount<0 ? 'var(--danger)' : 'var(--accent)';
    html += `<div class="card">
      <div class="row">
        <div>
          <div class="name">${escapeHtml(h.categoryName)}</div>
          <div class="sub">${HISTORY_TYPE_LABEL[h.type]||h.type}</div>
        </div>
        <div style="text-align:right;">
          <div class="amount" style="color:${color};">${sign}${parts.primary}</div>
          ${parts.secondary?`<div class="sub">≈ ${parts.secondary}</div>`:''}
        </div>
      </div>
      <div class="row" style="margin-top:6px;justify-content:flex-end;">
        <button class="icon-btn" onclick="deleteHistoryEntry('${h.id}')">✕</button>
      </div>
    </div>`;
  });
  return html;
}
// 撤销某条历史记录对分类余额/未分配池的影响
// 撤销「删除分类」：把分类原样恢复，余额从未分配池拿回去，并重新关联原来的目标
function restoreDeletedCategory(h){
  const s = h.snapshot;
  if(!s || state.categories.some(c=>c.id===s.id)) return '';
  let percent = s.monthlyPercent||0;
  let note = '';
  if(percent > percentLeft(null)){
    note = `\n（原本的 ${fmt(percent)}% 会让百分比合计超过 100%，已改为 0%，需要的话再去编辑）`;
    percent = 0;
  }
  state.categories.push({
    id:s.id, name:s.name, balance:h.amount, currency:s.currency,
    monthlyPlan:s.monthlyPlan||0, monthlyPercent:percent, notes:s.notes||[]
  });
  state.unallocated = (state.unallocated||0) - (h.poolDelta !== undefined ? h.poolDelta : toBase(h.amount, h.currency));
  (s.linkedGoalIds||[]).forEach(gid=>{
    const g = state.goals.find(x=>x.id===gid);
    if(g && !g.linkedCategoryIds.includes(s.id)) g.linkedCategoryIds.push(s.id);
  });
  return `已恢复分类「${s.name}」。${note}`;
}
// 一笔记录对分类/未分配池的影响。新记录直接读存下的值；旧记录（没有存）才按现在的汇率推算
function entryEffects(h){
  if(h.catDelta !== undefined || h.poolDelta !== undefined){
    return {catDelta: h.catDelta || 0, catCurrency: h.catCurrency, poolDelta: h.poolDelta || 0};
  }
  const amtBase = toBase(h.amount, h.currency);
  if(!h.categoryId) return {catDelta:0, poolDelta:amtBase};
  const cat = state.categories.find(c=>c.id===h.categoryId);
  return {
    catDelta: cat ? fromBase(amtBase, cat.currency) : 0,
    catCurrency: cat ? cat.currency : h.currency,
    poolDelta: (h.type==='transfer' || h.type==='allocation') ? -amtBase : 0
  };
}
function revertHistoryEntry(h){
  const eff = entryEffects(h);
  if(eff.catDelta){
    const cat = state.categories.find(c=>c.id===h.categoryId);
    if(!cat) return false; // 分类已被删除，无法还原
    // 分类后来改过币种时，把当时的变动换算成现在的币种
    const delta = (eff.catCurrency && eff.catCurrency!==cat.currency)
      ? fromBase(toBase(eff.catDelta, eff.catCurrency), cat.currency)
      : eff.catDelta;
    cat.balance -= delta;
  }
  state.unallocated = (state.unallocated||0) - eff.poolDelta;
  return true;
}
function deleteHistoryEntry(id){
  const h = state.history.find(x=>x.id===id);
  if(!h) return;
  const label = HISTORY_TYPE_LABEL[h.type] || h.type;
  const amtText = dualPartsForCurrency(Math.abs(h.amount), h.currency).primary;
  if(h.type==='release'){
    if(!confirm(`删除这条记录会恢复分类「${h.categoryName}」，并把 ${dualPartsForCurrency(h.amount, h.currency).primary} 从未分配池拿回去。确定吗？`)) return;
    const msg = restoreDeletedCategory(h);
    state.history = state.history.filter(x=>x.id!==id);
    save(); render();
    if(msg) alert(msg);
    return;
  }
  const catGone = h.categoryId && !state.categories.find(c=>c.id===h.categoryId);
  if(catGone){
    if(!confirm(`「${label} ${amtText}」对应的分类已被删除，无法还原金额，只能删掉这条记录。仍要删除吗？`)) return;
  }else{
    // 预先算出还原后的余额，会变成负数就在确认框里讲清楚
    const eff = entryEffects(h);
    const warns = [];
    const poolAfter = r2((state.unallocated||0) - eff.poolDelta);
    if(eff.poolDelta && poolAfter < 0){
      warns.push(`未分配池会变成 ${fmt(poolAfter)} ${state.baseCurrency}（这笔钱可能已经分配或花掉了）`);
    }
    const cat = h.categoryId ? state.categories.find(c=>c.id===h.categoryId) : null;
    if(cat && eff.catDelta){
      const d = (eff.catCurrency && eff.catCurrency!==cat.currency) ? fromBase(toBase(eff.catDelta, eff.catCurrency), cat.currency) : eff.catDelta;
      const catAfter = r2(cat.balance - d);
      if(catAfter < 0) warns.push(`「${cat.name}」会变成 ${fmt(catAfter)} ${cat.currency}（这笔钱可能已经花掉了）`);
    }
    const warnTxt = warns.length ? `\n\n⚠️ 注意：\n${warns.join('\n')}` : '';
    if(!confirm(`删除「${label} ${amtText}」并同时还原这笔钱？\n余额／未分配池会一起回滚。${warnTxt}`)) return;
    revertHistoryEntry(h);
  }
  state.history = state.history.filter(x=>x.id!==id);
  save(); render();
}

}

function onEditCategoryCurrencyChange(sel){
  const prev = sel.dataset.prev, next = sel.value;
  ['f_balance','f_monthlyPlan'].forEach(fid=>{
    const inp = document.getElementById(fid);
    const v = parseFloat(inp.value) || 0;
    inp.value = r2(fromBase(toBase(v, prev), next));
  });
  sel.dataset.prev = next;
}
function submitEditCategory(id){
  const c = state.categories.find(x=>x.id===id);
  const pErr = percentError(parseFloat(document.getElementById('f_monthlyPercent').value) || 0, id);
  if(pErr) return alert(pErr);
  const newName = document.getElementById('f_name').value.trim() || c.name;
  const newCurrency = document.getElementById('f_currency').value;
  const newBalance = r2(parseFloat(document.getElementById('f_balance').value) || 0);
  // 只换币种时余额应该是这个数；和输入值的差额才是真的「改了钱」
  const converted = r2(fromBase(toBase(c.balance, c.currency), newCurrency));
  const delta = r2(newBalance - converted);
  if(Math.abs(delta) >= 0.01){
    const txt = `${fmt(converted)} → ${fmt(newBalance)} ${newCurrency}`;
    if(!confirm(`余额 ${txt}\n会记一笔「余额校正」${delta>0?'+':''}${fmt(delta)} ${newCurrency}（之后删掉这条记录可以还原）。确定吗？`)) return;
  }
  if(newCurrency !== c.currency){
    (c.notes||[]).forEach(n=>{ n.amount = r2(fromBase(toBase(n.amount, c.currency), newCurrency)); });
  }
  c.name = newName;
  c.currency = newCurrency;
  c.balance = newBalance;
  c.monthlyPlan = parseFloat(document.getElementById('f_monthlyPlan').value) || 0;
  c.monthlyPercent = parseFloat(document.getElementById('f_monthlyPercent').value) || 0;
  if(Math.abs(delta) >= 0.01){
    addHistoryEntry({type:'adjust', categoryId:c.id, categoryName:c.name, amount:delta, currency:newCurrency,
      catDelta:delta, catCurrency:newCurrency, poolDelta:0});
  }
  save(); closeModal(); render();
}
function deleteCategory(id){
  const c = state.categories.find(x=>x.id===id);
  if(!c) return;
  const amtText = dualPartsForCurrency(c.balance, c.currency).primary;
  const msg = c.balance!==0
    ? `确定删除分类「${c.name}」吗？\n余额 ${amtText} 会转入未分配池。\n（之后在历史记录里删掉这笔，可以把分类恢复回来）`
    : `确定删除分类「${c.name}」吗？`;
  if(!confirm(msg)) return;
  const linkedGoalIds = state.goals.filter(g=>(g.linkedCategoryIds||[]).includes(id)).map(g=>g.id);
  if(c.balance!==0){
    const releasedBase = toBase(c.balance, c.currency);
    state.unallocated = (state.unallocated||0) + releasedBase;
    addHistoryEntry({
      type:'release', categoryId:c.id, categoryName:c.name, amount:c.balance, currency:c.currency, poolDelta:releasedBase,
      snapshot:{
        id:c.id, name:c.name, currency:c.currency, monthlyPlan:c.monthlyPlan||0,
        monthlyPercent:c.monthlyPercent||0, notes:c.notes||[], linkedGoalIds
      }
    });
  }
  state.categories = state.categories.filter(x=>x.id!==id);
  state.goals.forEach(g=>{ g.linkedCategoryIds = (g.linkedCategoryIds||[]).filter(x=>x!==id); });
  save(); render();
}

// 从分类扣钱会扣成负数时先问一下（未分配池本来就有这个提醒，分类之前没有）
function confirmCategoryOverspend(c, spendAmt){
  const after = r2(c.balance - spendAmt);
  if(after >= 0) return true;
  return confirm(`「${c.name}」余额只有 ${fmt(c.balance)} ${c.currency}，支出后会变成 ${fmt(after)} ${c.currency}。\n仍要继续吗？`);
}
function submitAddMoney(id){
  const c = state.categories.find(x=>x.id===id);
  const amt = parseFloat(document.getElementById('f_amount').value);
  if(isNaN(amt) || amt===0) return alert('请输入金额（支出填负数）');
  if(amt<0 && !confirmCategoryOverspend(c, -amt)) return;
  if(amt>0 && document.getElementById('f_source').value==='pool'){
    const amtBase = toBase(amt, c.currency);
    if(amtBase > (state.unallocated||0) && !confirm('未分配池余额不足，划入后未分配会变成负数，仍要继续吗？')) return;
    state.unallocated = (state.unallocated||0) - amtBase;
    addHistoryEntry({type:'transfer', categoryId:c.id, categoryName:c.name, amount:amt, currency:c.currency,
      catDelta:amt, catCurrency:c.currency, poolDelta:-amtBase});
  }else{
    addHistoryEntry({type: amt>=0?'deposit':'expense', categoryId:c.id, categoryName:c.name, amount:amt, currency:c.currency,
      catDelta:amt, catCurrency:c.currency, poolDelta:0});
  }
  c.balance += amt;
  save(); closeModal(); render();
}

function submitSpend(){
  const amt = parseFloat(document.getElementById('f_amount').value);
  const currency = document.getElementById('f_currency').value;
  const sourceId = document.getElementById('f_source').value;
  const label = document.getElementById('f_label').value.trim();
  if(isNaN(amt) || amt<=0) return alert('请输入大于 0 的金额');
  const amtBase = toBase(amt, currency);
  if(sourceId){
    const c = state.categories.find(x=>x.id===sourceId);
    if(!c) return;
    const catAmt = fromBase(amtBase, c.currency);
    if(!confirmCategoryOverspend(c, catAmt)) return;
    c.balance -= catAmt;
    addHistoryEntry({type:'expense', categoryId:c.id, categoryName: label ? `${c.name}・${label}` : c.name, amount:-amt, currency,
      catDelta:-catAmt, catCurrency:c.currency, poolDelta:0});
  }else{
    if(amtBase > (state.unallocated||0) && !confirm('未分配池余额不足，扣除后会变成负数，仍要继续吗？')) return;
    state.unallocated = (state.unallocated||0) - amtBase;
    addHistoryEntry({type:'expense', categoryId:null, categoryName: label || '未分配池', amount:-amt, currency, poolDelta:-amtBase});
  }
  save(); closeModal(); render();
}

/* ---------- 对账：把 App 里的金额校正成和银行一致 ---------- */
function openReconcileModal(){
  const base = state.baseCurrency;
  const row = (kind, id, name, value, currency)=>`
    <div class="row" style="margin-bottom:8px;">
      <div class="name" style="font-size:14px;">${escapeHtml(name)}</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <input class="recon-input" data-kind="${kind}" data-id="${id}" data-currency="${currency}" data-orig="${r2(value)}"
          type="number" step="0.01" value="${r2(value)}" oninput="updateReconcileSummary()"
          style="width:110px;text-align:right;padding:6px 8px;border-radius:8px;border:1px solid #e0e2e6;">
        <span class="sub" style="margin:0;width:34px;">${currency}</span>
      </div>
    </div>`;
  openModal(`
    <h2>对账</h2>
    <div class="sub" style="margin-bottom:12px;">打开银行 App，把台湾、马来西亚<b>所有账户</b>的钱加起来，填在下面。App 会算出差多少，你再决定差额放哪里。每一笔校正都会记在历史里，删掉那条记录就能还原。</div>
    <div class="field"><label>${base} 账户实际合计（可不填）</label>
      <input id="recon_bank" type="number" step="0.01" placeholder="例如 152340" oninput="updateReconcileSummary()">
    </div>
    ${state.secondaryCurrency!==base ? `<div class="field"><label>${state.secondaryCurrency} 账户实际合计（可不填，会按汇率 ${fmt(state.rates[state.secondaryCurrency]||1)} 换算）</label>
      <input id="recon_bank2" type="number" step="0.01" placeholder="例如 3200" oninput="updateReconcileSummary()">
    </div>` : ''}
    <div class="sub" id="recon_summary" style="margin-bottom:10px;"></div>
    <button class="pill-btn ghost" id="recon_fill_btn" style="width:100%;margin-bottom:14px;display:none;" onclick="reconcileDiffToPool()">把差额放进「未分配」</button>
    <div class="section-title" style="margin-top:0;">各项金额（可直接改）</div>
    ${row('pool', '', '未分配', state.unallocated||0, base)}
    ${state.categories.map(c=>row('cat', c.id, c.name, c.balance, c.currency)).join('')}
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="submit" onclick="confirmReconcile()">确认校正</button>
    </div>
  `);
  updateReconcileSummary();
}
function reconcileTotals(){
  let before = 0, after = 0;
  document.querySelectorAll('.recon-input').forEach(inp=>{
    before += toBase(parseFloat(inp.dataset.orig)||0, inp.dataset.currency);
    after += toBase(parseFloat(inp.value)||0, inp.dataset.currency);
  });
  const bankRaw = document.getElementById('recon_bank').value;
  const bank2El = document.getElementById('recon_bank2');
  const bank2Raw = bank2El ? bank2El.value : '';
  const bank = (bankRaw==='' && bank2Raw==='') ? null
    : r2((parseFloat(bankRaw)||0) + toBase(parseFloat(bank2Raw)||0, state.secondaryCurrency));
  return {before:r2(before), after:r2(after), bank};
}
function updateReconcileSummary(){
  const t = reconcileTotals();
  const base = state.baseCurrency;
  let txt = `App 原本总资产 ${fmt(t.before)} ${base}`;
  if(Math.abs(t.after - t.before) >= 0.01) txt += ` → 校正后 ${fmt(t.after)} ${base}`;
  const btn = document.getElementById('recon_fill_btn');
  if(t.bank !== null){
    const diff = r2(t.bank - t.after);
    txt += `\n银行合计 ${fmt(t.bank)} ${base}`;
    txt += Math.abs(diff) < 0.01
      ? `\n✓ 和银行对上了`
      : `\n和银行相比：App ${diff>0?'少了':'多了'} ${fmt(Math.abs(diff))} ${base}`;
    btn.style.display = Math.abs(diff) < 0.01 ? 'none' : 'block';
  }else{
    btn.style.display = 'none';
  }
  const el = document.getElementById('recon_summary');
  el.style.whiteSpace = 'pre-line';
  el.textContent = txt;
}
function reconcileDiffToPool(){
  const t = reconcileTotals();
  if(t.bank === null) return;
  const poolInp = document.querySelector('.recon-input[data-kind="pool"]');
  poolInp.value = r2((parseFloat(poolInp.value)||0) + (t.bank - t.after));
  updateReconcileSummary();
}
function confirmReconcile(){
  const changes = [];
  document.querySelectorAll('.recon-input').forEach(inp=>{
    const delta = r2((parseFloat(inp.value)||0) - (parseFloat(inp.dataset.orig)||0));
    if(Math.abs(delta) >= 0.01) changes.push({inp, delta});
  });
  if(changes.length===0){ closeModal(); return; }
  const t = reconcileTotals();
  if(!confirm(`共校正 ${changes.length} 项，总资产 ${fmt(t.before)} → ${fmt(t.after)} ${state.baseCurrency}。确定吗？`)) return;
  changes.forEach(({inp, delta})=>{
    if(inp.dataset.kind==='pool'){
      state.unallocated = (state.unallocated||0) + delta;
      addHistoryEntry({type:'adjust', categoryId:null, categoryName:'未分配池', amount:delta, currency:state.baseCurrency, poolDelta:delta});
    }else{
      const c = state.categories.find(x=>x.id===inp.dataset.id);
      if(!c) return;
      c.balance += delta;
      addHistoryEntry({type:'adjust', categoryId:c.id, categoryName:c.name, amount:delta, currency:c.currency,
        catDelta:delta, catCurrency:c.currency, poolDelta:0});
    }
  });
  save(); closeModal(); render();
}

  const g = state.goals.find(x=>x.id===goalId);
  const label = document.getElementById('f_gnote_label').value.trim();
  const amount = parseFloat(document.getElementById('f_gnote_amount').value);
  if(!label) return alert('请输入项目名称');
  if(isNaN(amount)) return alert('请输入金额');
  g.notes.push({id:uid(), label, amount});
  save(); renderGoalNotesModal(goalId);
}
function deleteGoalNoteItem(goalId, noteId){
  const g = state.goals.find(x=>x.id===goalId);
  g.notes = g.notes.filter(n=>n.id!==noteId);
  save(); renderGoalNotesModal(goalId);
}

/* ---------- 本月分配 ---------- */
function openAllocateModal(){
  const pool = state.unallocated || 0;
  const poolParts = dualPartsForBase(pool);
  const prefill = pool > 0 ? Math.round(pool*100)/100 : '';
  const hasPercent = state.categories.some(c=>(c.monthlyPercent||0)>0);
  openModal(`
    <h2>本月分配</h2>
    <div class="sub" style="margin-bottom:12px;">未分配池当前 ${poolParts.primary}${poolParts.secondary?' ≈ '+poolParts.secondary:''}</div>
    <div class="field"><label>分配方式</label>
      <select id="alloc_mode" onchange="onAllocModeChange()">
        <option value="percent" ${hasPercent?'selected':''}>按百分比（月收入 × 各分类百分比）</option>
        <option value="plan" ${hasPercent?'':'selected'}>按每月固定金额的比例</option>
      </select>
    </div>
    <div class="sub" id="alloc_hint" style="margin-bottom:12px;"></div>
    <div class="field"><label>本月收入／要分配的总金额（已预填未分配池全部，可修改）</label><input id="alloc_total" type="number" step="0.01" value="${prefill}" placeholder="例如 25000" oninput="updateAllocSummary()"></div>
    <div class="field"><label>金额币种</label><select id="alloc_currency">${currencyOptions(state.baseCurrency)}</select></div>
    <button class="pill-btn ghost" onclick="generateAllocationSuggestion()">生成建议分配</button>
    <div id="alloc_rows" style="margin-top:14px;"></div>
    <div class="sub" id="alloc_summary" style="margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="submit" onclick="confirmAllocation()">确认并存入</button>
    </div>
  `);
  onAllocModeChange();
}
function onAllocModeChange(){
  const mode = document.getElementById('alloc_mode').value;
  const hint = document.getElementById('alloc_hint');
  if(mode==='percent'){
    const list = state.categories.filter(c=>(c.monthlyPercent||0)>0);
    const sum = list.reduce((s,c)=>s+c.monthlyPercent,0);
    hint.textContent = list.length
      ? `${list.map(c=>c.name+' '+fmt(c.monthlyPercent)+'%').join('、')}（合计 ${fmt(sum)}%${sum<100?'，剩下的会留在未分配池':''}${sum>100?'，已超过 100%':''}）`
      : '还没有分类设了百分比。可以去「设置 → 套用百分比方案」一键建好，或在分类里单独填百分比。';
  }else{
    const list = state.categories.filter(c=>c.monthlyPlan>0);
    hint.textContent = list.length
      ? '按各分类「每月固定分配金额」的比例，换算到你输入的总金额。'
      : '还没有分类填了「每月固定分配金额」，请先去「分类」里编辑。';
  }
  document.getElementById('alloc_rows').innerHTML = '';
  document.getElementById('alloc_summary').textContent = '';
}
function generateAllocationSuggestion(){
  const mode = document.getElementById('alloc_mode').value;
  const totalAmt = parseFloat(document.getElementById('alloc_total').value);
  const totalCurrency = document.getElementById('alloc_currency').value;
  if(isNaN(totalAmt) || totalAmt<=0) return alert('请输入本月收入/总金额');
  const totalBase = toBase(totalAmt, totalCurrency);
  let rows, targetBase;
  if(mode==='percent'){
    const planned = state.categories.filter(c=>(c.monthlyPercent||0)>0);
    if(planned.length===0) return alert('还没有分类设了百分比。可以去「设置 → 套用百分比方案」一键建好。');
    const pUsed = percentUsed(null);
    if(pUsed > 100) return alert(`各分类百分比合计 ${fmt(pUsed)}%，超过 100%。\n请先到「分类」把百分比调低 ${fmt(pUsed-100)}%。`);
    targetBase = totalBase * pUsed / 100;
    rows = planned.map(c=>{
      const suggestBase = totalBase * (c.monthlyPercent/100);
      return {
        id:c.id, name:c.name, currency:c.currency, note:fmt(c.monthlyPercent)+'%',
        amount:Math.round((suggestBase/(state.rates[c.currency]||1))*100)/100
      };
    });
  }else{
    const planned = state.categories.filter(c=>c.monthlyPlan>0);
    if(planned.length===0) return alert('请先在「分类」里编辑分类，填好「每月固定分配金额」');
    const refTotalBase = planned.reduce((s,c)=>s+toBase(c.monthlyPlan,c.currency),0);
    targetBase = totalBase;
    rows = planned.map(c=>{
      const suggestBase = (toBase(c.monthlyPlan,c.currency)/refTotalBase)*totalBase;
      return {
        id:c.id, name:c.name, currency:c.currency, note:'',
        amount:Math.round((suggestBase/(state.rates[c.currency]||1))*100)/100
      };
    });
  }
  // 每项各自四舍五入后加总可能差几分钱：把差额补到金额最大的一项（优先选本位币的分类，才能精确补齐）
  const diffBase = targetBase - rows.reduce((s,r)=>s+toBase(r.amount, r.currency), 0);
  if(Math.abs(diffBase) >= 0.005){
    const pool = rows.filter(r=>r.currency===state.baseCurrency);
    const pick = (pool.length?pool:rows).reduce((a,b)=>toBase(b.amount,b.currency)>toBase(a.amount,a.currency)?b:a);
    pick.amount = r2(pick.amount + fromBase(diffBase, pick.currency));
  }
  document.getElementById('alloc_rows').innerHTML = rows.map(r=>`
    <div class="row" style="margin-bottom:8px;">
      <div>
        <div class="name" style="font-size:14px;">${escapeHtml(r.name)}</div>
        ${r.note?`<div class="sub">${r.note}</div>`:''}
      </div>
      <input data-catid="${r.id}" data-currency="${r.currency}" class="alloc-input"
        type="number" step="0.01" value="${r.amount}"
        style="width:120px;text-align:right;padding:6px 8px;border-radius:8px;border:1px solid #e0e2e6;"
        oninput="updateAllocSummary()">
    </div>
  `).join('');
  updateAllocSummary();
}
function updateAllocSummary(){
  const inputs = document.querySelectorAll('.alloc-input');
  if(inputs.length===0) return;
  let sumBase = 0;
  inputs.forEach(inp=>{
    sumBase += toBase(parseFloat(inp.value)||0, inp.dataset.currency);
  });
  const parts = dualPartsForBase(sumBase);
  const totalBase = toBase(parseFloat(document.getElementById('alloc_total').value)||0, document.getElementById('alloc_currency').value);
  const leftBase = totalBase - sumBase;
  const leftParts = dualPartsForBase(Math.abs(leftBase));
  document.getElementById('alloc_summary').textContent =
    `已分配合计 ≈ ${parts.primary}${parts.secondary?'（≈'+parts.secondary+'）':''} ・ ${leftBase>=0?'未分配剩余':'超出总额'} ${leftParts.primary}`;
}
function confirmAllocation(){
  const inputs = document.querySelectorAll('.alloc-input');
  if(inputs.length===0) return alert('请先点「生成建议分配」');
  let sumBase = 0;
  inputs.forEach(inp=>{ sumBase += toBase(parseFloat(inp.value)||0, inp.dataset.currency); });
  // 容许几分钱的换算误差（例如分类是 MYR 时，0.01 MYR = 0.08 NTD），避免误报
  if(sumBase - (state.unallocated||0) > 0.1 && !confirm('分配总额超过未分配池余额，确认后未分配会变成负数，仍要继续吗？')) return;
  inputs.forEach(inp=>{
    const amt = parseFloat(inp.value)||0;
    const cat = state.categories.find(c=>c.id===inp.dataset.catid);
    if(cat && amt!==0){
      const amtBase = toBase(amt, cat.currency);
      cat.balance += amt;
      state.unallocated = (state.unallocated||0) - amtBase;
      addHistoryEntry({type:'allocation', categoryId:cat.id, categoryName:cat.name, amount:amt, currency:cat.currency,
        catDelta:amt, catCurrency:cat.currency, poolDelta:-amtBase});
    }
  });
  save(); closeModal(); render();
}

/* ---------- 百分比方案一键套用 ---------- */
function openPercentPlanModal(){
  const planSum = PERCENT_PLAN.reduce((s,p)=>s+p.percent,0);
  const rows = PERCENT_PLAN.map((p,i)=>{
    const exact = state.categories.find(c=>c.name===p.name);
    return `
    <div class="field" style="margin-bottom:10px;">
      <label>${escapeHtml(p.name)} ${p.percent}%</label>
      <select class="pplan-select" data-idx="${i}">
        <option value="__new__" ${exact?'':'selected'}>新建分类「${escapeHtml(p.name)}」</option>
        ${state.categories.map(c=>`<option value="${c.id}" ${exact&&exact.id===c.id?'selected':''}>套用到已有分类：${escapeHtml(c.name)}</option>`).join('')}
        <option value="__skip__">跳过，不设这项</option>
      </select>
    </div>`;
  }).join('');
  openModal(`
    <h2>套用百分比方案</h2>
    <div class="sub" style="margin-bottom:14px;">合计 ${planSum}%。每一项可以新建分类，或套用到你已有的分类（例如「储蓄」套用到已有的 Savings，避免重复）。套用后去「本月分配」选「按百分比」，输入月收入就会自动算好。</div>
    ${rows}
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="submit" onclick="applyPercentPlan()">套用</button>
    </div>
  `);
}
function applyPercentPlan(){
  // 先整理出要做的改动，校验通过后才真正写入
  const toCreate = [];
  const toUpdate = {}; // 已有分类 id -> 百分比
  for(const sel of document.querySelectorAll('.pplan-select')){
    const p = PERCENT_PLAN[parseInt(sel.dataset.idx,10)];
    if(!p || sel.value==='__skip__') continue;
    if(sel.value==='__new__'){ toCreate.push(p); continue; }
    if(toUpdate[sel.value]!==undefined){
      const dup = state.categories.find(x=>x.id===sel.value);
      return alert(`「${dup?dup.name:''}」被选了两次，每个已有分类只能对应方案里的一项。`);
    }
    toUpdate[sel.value] = p.percent;
  }
  const planPart = toCreate.reduce((s,p)=>s+p.percent,0) + Object.values(toUpdate).reduce((s,v)=>s+v,0);
  const others = state.categories.filter(c=>toUpdate[c.id]===undefined && (c.monthlyPercent||0)>0);
  const otherPart = others.reduce((s,c)=>s+c.monthlyPercent,0);
  let clearOthers = false;
  if(Math.round((planPart+otherPart)*100)/100 > 100){
    if(!confirm(`套用后百分比合计会是 ${fmt(planPart+otherPart)}%，超过 100%。\n方案以外还有：${others.map(c=>c.name+' '+fmt(c.monthlyPercent)+'%').join('、')}。\n\n要把这些分类的百分比清零后再套用吗？`)) return;
    clearOthers = true;
  }
  if(clearOthers) others.forEach(c=>{ c.monthlyPercent = 0; });
  toCreate.forEach(p=>{
    state.categories.push({
      id:uid(), name:p.name, balance:0, currency:state.baseCurrency,
      monthlyPlan:0, monthlyPercent:p.percent, notes:[]
    });
  });
  Object.entries(toUpdate).forEach(([id,percent])=>{
    const c = state.categories.find(x=>x.id===id);
    if(c) c.monthlyPercent = percent;
  });
  const created = toCreate.length, updated = Object.keys(toUpdate).length;
  save(); closeModal(); render();
  alert(`已套用：新建 ${created} 个分类，更新 ${updated} 个已有分类。\n去「总览 → 本月分配」选「按百分比」就能用了。`);
}

function openAddCurrencyModal(){
  openModal(`
    <h2>添加币种</h2>
    <div class="field"><label>币种代码（如 USD、JPY、EUR）</label><input id="f_code" placeholder="USD" style="text-transform:uppercase;"></div>
    <div class="field"><label>汇率（1 单位 = 多少 ${state.baseCurrency}）</label><input id="f_rate" type="number" step="0.0001" value="1"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="submit" onclick="submitAddCurrency()">保存</button>
    </div>
  `);
}
function submitAddCurrency(){
  const code = document.getElementById('f_code').value.trim().toUpperCase();
  const rate = parseFloat(document.getElementById('f_rate').value);
  if(!code) return alert('请输入币种代码');
  if(!/^[A-Z]{2,5}$/.test(code)) return alert('币种代码请用 2～5 个英文字母，例如 USD');
  if(code===state.baseCurrency) return alert(`${code} 是本位币，汇率固定为 1，不用添加。`);
  if(state.rates[code]!==undefined) return alert(`${code} 已经有了，要改汇率请直接在「汇率设置」里改。`);
  if(isNaN(rate) || rate<=0) return alert('请输入有效汇率');
  state.rates[code] = rate;
  save(); closeModal(); render();
}

function updateRate(code, value){
  const rate = parseFloat(value);
  if(isNaN(rate) || rate<=0 || code===state.baseCurrency) return;
  state.rates[code] = rate;
  save();
  renderHeader();
}

function changeSecondaryCurrency(code){
  state.secondaryCurrency = code;
  save(); render();
}

function changeBaseCurrency(newBase){
  ensureRate(newBase);
  const pivot = state.rates[newBase] || 1;
  Object.keys(state.rates).forEach(code=>{
    state.rates[code] = state.rates[code] / pivot;
  });
  state.rates[newBase] = 1;
  state.unallocated = (state.unallocated||0) / pivot; // 未分配池按本位币计，需一并折算
  state.baseCurrency = newBase;
  save(); render();
}

/* ---------- 备份 ---------- */
function exportData(){
  const now = new Date().toISOString();
  state.lastBackupAt = now;
  save();
  const blob = new Blob([JSON.stringify({...state, exportedAt: now}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `budget-backup-${localDateStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  // iOS Safari 立刻释放链接可能导致下载失败，稍后再释放
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  render();
}
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{
      data = normalizeData(JSON.parse(reader.result));
    }catch(err){
      return alert('导入失败：文件格式不正确');
    }
    // 先让用户看清楚备份里是什么，再决定要不要覆盖
    const fileTotal = (data.unallocated||0) + data.categories.reduce((s,c)=>s+c.balance*(data.rates[c.currency]!==undefined?data.rates[c.currency]:1),0);
    const when = data.exportedAt ? `导出时间：${localDateStr(new Date(data.exportedAt))}\n` : '';
    const msg = `这个备份里有：\n${when}分类 ${data.categories.length} 个、目标 ${data.goals.length} 个、历史记录 ${data.history.length} 笔\n总资产 ${fmt(fileTotal)} ${data.baseCurrency}\n\n导入会【完全覆盖】手机上现在的数据（分类 ${state.categories.length} 个、历史 ${state.history.length} 笔）。确定要导入吗？`;
    if(!confirm(msg)) return;
    try{ localStorage.setItem(STORAGE_KEY + '_before_import', JSON.stringify(state)); }catch(_){}
    if(data.exportedAt) data.lastBackupAt = data.exportedAt; // 导入的文件本身就是那一天的备份
    delete data.exportedAt;
    state = data;
    save(); render();
    alert('导入成功');
  };
  reader.readAsText(file);
  e.target.value = '';
});
function clearAllData(){
  if(!confirm('确定要清空所有数据吗？此操作无法撤销，建议先导出备份。')) return;
  state = defaultState();
  save(); render();
}

/* ---------- 事件绑定 ---------- */
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; render(); });
});
document.getElementById('fabBtn').addEventListener('click', ()=>{
  if(activeTab==='goals') openAddGoalModal();
  else openAddCategoryModal();
});

render();

if('serviceWorker' in navigator){
  // 新版 SW 接管时自动刷新一次，载入最新页面（首次安装不刷新）
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'})
      .then(reg=>reg.update())
      .catch(()=>{});
  });
}
